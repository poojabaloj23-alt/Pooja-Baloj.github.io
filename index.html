<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Portfolio of Pooja Bharamu Baloj - BCA Graduate, Software Intern and Full Stack Developer.">

    <title>Pooja Bharamu Baloj | Portfolio</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* =========================
           GLOBAL STYLES
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #7c3aed;
            --secondary: #a855f7;
            --accent: #ec4899;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --text: #334155;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }


        /* =========================
           NAVBAR
        ========================== */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .nav-container {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--dark);
            font-size: 14px;
            font-weight: 600;

            position: relative;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;

            width: 0;
            height: 2px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--accent)
            );

            transition: 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-btn {
            display: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark);
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(124, 58, 237, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(236, 72, 153, 0.12),
                    transparent 30%
                ),
                var(--light);
        }

        .hero-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 60px;
            padding-top: 70px;
        }

        .hero-content {
            animation: slideLeft 1s ease;
        }

        .small-heading {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .hero h1 {
            font-size: clamp(42px, 6vw, 72px);
            line-height: 1.1;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .hero h1 span {
            background: linear-gradient(
                90deg,
                var(--primary),
                var(--accent)
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h2 {
            font-size: 24px;
            color: #475569;
            margin-bottom: 20px;
        }

        .hero-description {
            max-width: 650px;
            color: #64748b;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );
            color: white;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(124, 58, 237, 0.35);
        }

        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }


        /* =========================
           HERO CARD
        ========================== */

        .hero-card {
            display: flex;
            justify-content: center;

            animation: slideRight 1s ease;
        }

        .profile-card {
            width: 310px;
            height: 360px;

            border-radius: 30px;

            background: linear-gradient(
                145deg,
                #ffffff,
                #f1f5f9
            );

            box-shadow: var(--shadow);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .profile-circle {
            width: 210px;
            height: 210px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 75px;
            font-weight: 800;

            box-shadow:
                0 20px 50px rgba(124, 58, 237, 0.35);
        }

        .floating-badge {
            position: absolute;

            background: white;
            padding: 10px 16px;

            border-radius: 30px;

            box-shadow: var(--shadow);

            font-size: 13px;
            font-weight: 700;
        }

        .badge-one {
            top: 40px;
            left: -30px;
        }

        .badge-two {
            bottom: 45px;
            right: -30px;
        }


        /* =========================
           SECTION
        ========================== */

        section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title span {
            color: var(--primary);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title h2 {
            color: var(--dark);
            font-size: 38px;
            margin-top: 8px;
        }

        .section-title p {
            color: #64748b;
            max-width: 600px;
            margin: 10px auto;
        }


        /* =========================
           ABOUT
        ========================== */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .about-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);

            transition: 0.3s;
        }

        .about-card:hover {
            transform: translateY(-7px);
        }

        .about-card h3 {
            color: var(--dark);
            margin-bottom: 15px;
            font-size: 22px;
        }

        .about-card p {
            color: #64748b;
        }

        .info-list {
            margin-top: 15px;
        }

        .info-list li {
            padding: 9px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-list strong {
            color: var(--dark);
        }


        /* =========================
           SKILLS
        ========================== */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(180px, 1fr)
            );
            gap: 20px;
        }

        .skill-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .skill-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .skill-card h3 {
            color: var(--dark);
            font-size: 16px;
        }


        /* =========================
           PROJECTS
        ========================== */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 25px;
        }

        .project-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: 0.35s;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        .project-image {
            height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--accent)
                );

            color: white;
            font-size: 55px;
        }

        .project-content {
            padding: 25px;
        }

        .project-content h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .project-content p {
            color: #64748b;
            font-size: 14px;
        }

        .project-tags {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .tag {
            background: #f3e8ff;
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           EXPERIENCE
        ========================== */

        .timeline {
            max-width: 800px;
            margin: auto;
            position: relative;
        }

        .timeline::before {
            content: "";
            position: absolute;

            left: 15px;
            top: 0;
            bottom: 0;

            width: 2px;
            background: #ddd6fe;
        }

        .timeline-item {
            position: relative;
            padding-left: 55px;
            margin-bottom: 40px;
        }

        .timeline-dot {
            position: absolute;

            left: 5px;
            top: 5px;

            width: 22px;
            height: 22px;

            border-radius: 50%;

            background: var(--primary);
            border: 5px solid #ede9fe;
        }

        .timeline-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .timeline-card h3 {
            color: var(--dark);
        }

        .timeline-card .company {
            color: var(--primary);
            font-weight: 700;
        }

        .timeline-card .date {
            color: #64748b;
            font-size: 13px;
            margin: 5px 0 12px;
        }


        /* =========================
           CERTIFICATES
        ========================== */

        .certificates {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 20px;
        }

        .certificate {
            background: white;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .certificate:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
        }

        .certificate-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .certificate h3 {
            color: var(--dark);
            font-size: 16px;
        }


        /* =========================
           EDUCATION
        ========================== */

        .education-card {
            background: white;
            max-width: 800px;
            margin: auto;

            padding: 35px;

            border-radius: 20px;

            border-left: 5px solid var(--primary);

            box-shadow: var(--shadow);
        }

        .education-card h3 {
            color: var(--dark);
            font-size: 22px;
        }

        .education-card .college {
            color: var(--primary);
            font-weight: 700;
            margin: 5px 0;
        }

        .cgpa {
            display: inline-block;

            margin-top: 15px;

            background: #f3e8ff;
            color: var(--primary);

            padding: 8px 15px;
            border-radius: 20px;

            font-weight: 800;
        }


        /* =========================
           LANGUAGES
        ========================== */

        .languages {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .language {
            background: white;
            padding: 15px 25px;
            border-radius: 30px;

            border: 1px solid var(--border);

            font-weight: 700;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }


        /* =========================
           CONTACT
        ========================== */

        .contact-box {
            background:
                linear-gradient(
                    135deg,
                    #1e1b4b,
                    #581c87
                );

            color: white;

            border-radius: 25px;

            padding: 60px 30px;

            text-align: center;

            box-shadow: var(--shadow);
        }

        .contact-box h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .contact-box p {
            color: #ddd6fe;
            max-width: 600px;
            margin: auto;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .contact-link {
            background: white;
            color: var(--dark);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            transition: 0.3s;
        }

        .contact-link:hover {
            transform: translateY(-3px);
            background: #f3e8ff;
            color: var(--primary);
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            background: var(--dark);
            color: #94a3b8;
            text-align: center;
            padding: 30px 15px;
        }

        footer strong {
            color: white;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 850px) {

            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-buttons {
                justify-content: center;
            }

            .hero-card {
                order: -1;
            }

            .profile-card {
                width: 270px;
                height: 300px;
            }

            .profile-circle {
                width: 170px;
                height: 170px;
                font-size: 60px;
            }

            .about-grid {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 700px) {

            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;

                position: absolute;
                top: 75px;
                left: 0;

                width: 100%;

                background: white;

                flex-direction: column;

                text-align: center;

                padding: 25px;

                box-shadow: var(--shadow);
            }

            .nav-links:target {
                display: flex;
            }

            section {
                padding: 70px 0;
            }

            .section-title h2 {
                font-size: 30px;
            }

            .hero h1 {
                font-size: 42px;
            }

            .floating-badge {
                display: none;
            }
        }

    </style>
</head>
